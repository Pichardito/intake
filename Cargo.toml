[workspace]
resolver = "2"
members = ["crates/intake-core", "crates/intake-server"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/Pichardito/intake"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
